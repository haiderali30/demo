name: CI/CD Pipeline

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run lint and tests
        run: make lint test

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Log in only if this is NOT a pull request (Row 2 & 3: main / release tag)
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build the image; push only if on main or a v* tag
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ vars.DOCKERHUB_USER }}/demo:${{ github.sha }}
            ${{ startsWith(github.ref, 'refs/tags/v') && format('{0}/demo:{1}', vars.DOCKERHUB_USER, github.ref_name) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
